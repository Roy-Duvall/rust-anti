[package]
name = "SymbolicLinker_v3r_1"
version = "3.1.0"
edition = "2021"

[dependencies]
native-windows-gui = { version = "1.0.13", features = ["all"] }
serde_json = "1.0"
walkdir = "2.5"
winapi = { version = "0.3.9", features = [
    "shobjidl",
    "shobjidl_core",
    "combaseapi",
    "objidl",
    "winerror",
    "ntdef"
] }
windows-sys = { version = "0.59", features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell"
] }

[build-dependencies]
winres = "0.1"
